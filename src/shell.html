<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101c24" />
    <meta
      name="description"
      content="你第一次醒来，却已经在回收名单上。与凯、莉拉，或独自追查一份不该存在的记录。仿生黎明网页试玩版。"
    />
    <title>仿生黎明 · Synthetic Dawn</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101c24'/%3E%3Cpath d='M13 43h38M18 36a14 14 0 0 1 28 0M32 8v8M9 17l6 6M55 17l-6 6' fill='none' stroke='%2382d8d0' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="src/style.css?v=0.2.0" />
    <link
      rel="preload"
      as="image"
      href="game/webp/bg/bg_city_night.mobile.webp"
      media="(max-width: 700px)"
    />
  </head>
  <body>
    <a class="skip-link" href="#dialogue-text">跳到剧情文本</a>
    <main id="app">
      <section
        id="title-screen"
        class="screen title-screen"
        aria-label="主菜单"
      >
        <picture class="title-art"
          ><source
            media="(max-width:700px)"
            srcset="game/webp/bg/bg_city_night.mobile.webp" />
          <img
            src="game/webp/bg/bg_city_night.webp"
            alt="夜色中的城市与高架列车"
            fetchpriority="high"
        /></picture>
        <div class="title-shade"></div>
        <header class="title-header">
          <a class="wordmark" href="./" aria-label="仿生黎明主菜单">仿生黎明</a
          ><span>薛定谔的喵 · 作品</span
          ><button data-action="settings" class="quiet">设置</button>
        </header>
        <div class="title-content">
          <p class="title-kicker">一份被提前写好的回收记录。</p>
          <h1>仿生黎明<span lang="en">Synthetic Dawn</span></h1>
          <p class="title-description">你第一次醒来，<br />却已经在名单上。</p>
          <p class="title-detail">
            在这座城市，编号决定你的归属。<br />而你，开始有了自己的问题。
          </p>
          <div class="title-actions">
            <button
              id="start-button"
              class="primary"
              data-action="start"
              disabled
            >
              正在载入剧本…</button
            ><button id="continue-button" data-action="continue" hidden>
              继续故事
            </button>
          </div>
          <p id="continue-hint" class="subtle"></p>
          <nav class="title-links" aria-label="其他功能">
            <button data-action="load">读取存档</button
            ><button data-action="gallery">回忆画廊</button
            ><button data-action="about">关于作品</button>
          </nav>
          <p id="boot-error" role="alert" hidden></p>
        </div>
        <picture class="title-character" aria-hidden="true"
          ><source
            media="(max-width:700px)"
            srcset="game/webp/characters/aria/base_aria_default.mobile.webp" />
          <img src="game/webp/characters/aria/base_aria_default.webp" alt=""
        /></picture>
        <footer class="title-footer">
          <span>第一章与三条路线体验</span><span>试玩版 0.2</span>
        </footer>
      </section>

      <section
        id="game-screen"
        class="screen game-screen"
        aria-label="故事"
        hidden
      >
        <div
          id="scene-background"
          class="scene-background"
          aria-hidden="true"
        ></div>
        <header class="game-header">
          <button class="wordmark quiet" data-action="menu">仿生黎明</button
          ><span id="chapter-title"></span>
          <div class="header-tools">
            <button id="clues-button" data-action="clues">
              线索 <span id="clue-count">0</span></button
            ><button data-action="menu" aria-label="打开游戏菜单">菜单</button>
          </div>
        </header>
        <div class="story-stage">
          <div id="visual-stage" class="visual-stage" aria-label="场景人物">
            <div id="cg-image" class="cg-image" hidden></div>
            <div id="actors" class="actors"></div>
            <div
              id="chapter-notice"
              class="chapter-notice"
              aria-hidden="true"
            ></div>
          </div>
          <div id="reading-panel" class="reading-panel">
            <p id="speaker" class="speaker"></p>
            <div
              id="dialogue-text"
              class="dialogue-text"
              tabindex="0"
              aria-label="当前对白"
            ></div>
            <div
              id="dialogue-announcement"
              class="sr-only"
              aria-live="polite"
              aria-atomic="true"
            ></div>
            <fieldset id="choices" class="choices" hidden>
              <legend id="choice-prompt"></legend>
              <div id="choice-list"></div>
            </fieldset>
            <div class="reading-footer">
              <span id="reading-hint">点击文字展开；再次点击继续</span
              ><button id="next-button" data-action="next" class="next-button">
                继续 <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>
        <nav class="game-controls" aria-label="阅读控制">
          <button id="back-button" data-action="back">回退</button
          ><button id="auto-button" data-action="auto" aria-pressed="false">
            自动</button
          ><button id="skip-button" data-action="skip" aria-pressed="false">
            已读快进</button
          ><button data-action="history">历史</button
          ><button class="desktop-control" data-action="save">存档</button
          ><button class="desktop-control" data-action="settings">设置</button
          ><button
            id="sound-button"
            data-action="sound"
            aria-label="切换声音"
            aria-pressed="false"
          >
            声音开
          </button>
        </nav>
      </section>

      <section
        id="end-screen"
        class="screen end-screen"
        hidden
        aria-label="章节结束"
      >
        <div id="end-art" class="end-art" aria-hidden="true"></div>
        <div class="end-shade"></div>
        <article class="end-content">
          <p id="end-caption" class="end-caption"></p>
          <h1 id="end-title"></h1>
          <p id="end-summary"></p>
          <ul id="end-recap"></ul>
          <blockquote id="end-hook"></blockquote>
          <div class="end-actions">
            <button class="primary" id="end-return" data-action="checkpoint">
              回到路线分歧</button
            ><button data-action="gallery">查看回忆</button
            ><button data-action="title">返回主菜单</button>
          </div>
          <p class="subtle">
            这是章节试玩的终点。故事尚未结束，你的选择已经留下痕迹。
          </p>
        </article>
      </section>
    </main>

    <dialog id="panel" aria-labelledby="panel-title">
      <div class="panel-header">
        <h2 id="panel-title"></h2>
        <button id="close-panel" aria-label="关闭面板">关闭</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </dialog>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message"></p>
        <div class="confirm-buttons">
          <button value="cancel">取消</button
          ><button value="accept" class="primary" id="confirm-accept">
            确认
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <noscript
      ><p class="noscript">
        本作品需要启用 JavaScript 才能播放剧情。
      </p></noscript
    >
    <script type="module" src="src/app.js?v=0.2.0"></script>
  </body>
</html>
